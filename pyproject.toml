[project]
name = "ssh-honeypot-lab"
version = "0.1.0"
description = "A small SSH honeypot for experimenting with different service configurations."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]